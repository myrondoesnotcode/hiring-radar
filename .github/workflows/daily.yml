name: Daily rebuild

# Every morning: read the job boards, recompute signals, rebuild the page, publish to GitHub Pages.
# A push to main only rebuilds and publishes (no new snapshot).
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00/07:00 Israel
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot job boards
        if: github.event_name != 'push'
        run: python3 snapshot.py

      - name: Signals
        run: python3 signals.py > /dev/null

      - name: Build page
        run: |
          python3 build_page.py
          mkdir -p _site && cp site/index.html _site/index.html
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "hiring-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/history.csv data/report.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
