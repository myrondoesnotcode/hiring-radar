<title>Deploy Hiring Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: a full-screen vertical video-style feed (TikTok/Reels): one company per screen, overlay text bottom-left,
   action rail right, tabs on top, nav bar at the bottom. The Discover tab is a light-paper ranking page. Deploy colors. */
:root{
  --paper:#F3EEDF; --ink:#11100D; --orange:#FF5A18; --yellow:#FFD23F;
  --muted:#6B6558; --line:#D9D1BC; --card:#FBF8EF; --lock:#E6DFCB;
  --bg:var(--paper); --fg:var(--ink);
  --feed-bg:#0B0A08; --on-feed:#FFFFFF; --on-feed-dim:rgba(255,255,255,.72); --glass:rgba(255,255,255,.14);
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pixel:"Silkscreen","IBM Plex Mono",monospace;
  --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11100D;--fg:#F3EEDF;--muted:#A39C8A;--line:#2E2B24;--card:#1A1915;--lock:#2A2720;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11100D;--fg:#F3EEDF;--muted:#A39C8A;--line:#2E2B24;--card:#1A1915;--lock:#2A2720;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--feed-bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,th:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--feed-bg);overflow:hidden}

/* ---------- FEED ---------- */
#feed{position:absolute;inset:0 0 var(--nav-h);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:var(--on-feed)}
.bgfx{position:absolute;inset:-10%;background:
   radial-gradient(60% 50% at var(--x1,30%) var(--y1,30%), hsl(var(--h) 85% 45% / .85), transparent 70%),
   radial-gradient(50% 45% at var(--x2,80%) var(--y2,70%), hsl(calc(var(--h) + 40) 90% 50% / .6), transparent 70%),
   linear-gradient(160deg, hsl(var(--h) 40% 12%), #0B0A08 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-3%,2%)}}
.mono{position:absolute;right:-6%;top:12%;font-family:var(--display);font-size:62vmin;line-height:.8;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.10);pointer-events:none;user-select:none}
.photo{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(26px) brightness(.5) saturate(1.25);animation:drift 14s ease-in-out infinite alternate}
.frame{width:calc(100% + 56px);height:min(calc((min(100vw,520px) - 32px) / 1.91), 28vh);border-radius:14px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 14px 40px rgba(0,0,0,.55);background:#000}
.frame img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.slide.has-img .center{top:calc(env(safe-area-inset-top,0px) + 58px)}
.slide.has-img .bignum{font-size:clamp(68px,22vw,116px)}
.avatar img,.story .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;display:block}
.jobs-cta{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:8px 14px;border-radius:999px;background:var(--orange);color:#11100D;font-weight:700;font-size:14px}
.coach{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.72)}
.coach .tip{position:absolute;color:#fff;font-weight:700;font-size:15px;line-height:1.25;text-align:right;max-width:190px}
.coach .tip small{display:block;font-weight:400;font-size:13px;color:rgba(255,255,255,.75)}
.coach .tip::after{content:"→";position:absolute;right:-26px;top:0;color:var(--orange);font-size:20px}
.coach .ring{position:absolute;border:2px solid var(--orange);border-radius:50%;box-shadow:0 0 0 6px rgba(255,90,24,.25)}
.coach .hand{position:absolute;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;text-align:center;color:#fff;font-weight:700}
.coach .hand i{font-style:normal;font-size:34px;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%{transform:translateY(24px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.coach .pill{position:absolute;border:2px solid var(--orange);border-radius:999px;box-shadow:0 0 0 6px rgba(255,90,24,.25)}
.coach .cta-tip{position:absolute;color:#fff;font-weight:700;font-size:15px}
.coach .ok{position:absolute;left:16px;padding:11px 26px;border-radius:999px;background:#fff;color:#000;font-weight:700}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.45) 0, transparent 22%, transparent 45%, rgba(0,0,0,.78) 100%)}
.center{position:absolute;left:0;right:72px;top:20%;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-feed-dim)}
.bignum{font-family:var(--display);font-size:clamp(84px,30vw,150px);line-height:.85;color:var(--on-feed);font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.bignum span{color:var(--orange)}
.biglabel{font-weight:700;font-size:17px;max-width:18ch;line-height:1.15}
.statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.st b{font-variant-numeric:tabular-nums}
.st.lock{border:1px dashed rgba(255,255,255,.5)}
.st.lock b{filter:blur(4px)}
.bottom{position:absolute;left:0;right:76px;bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:7px}
.handle{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--orange);color:#11100D;font-size:10px;font-weight:700}
.caption{font-size:14px;line-height:1.35;max-width:36ch}
.caption .tag{font-weight:700}
.more{font-weight:700;color:var(--on-feed-dim)}
.ticker{display:flex;align-items:center;gap:8px;font-size:13px;overflow:hidden;white-space:nowrap}
.ticker .note{flex:none}
.ticker .track{overflow:hidden;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.ticker .run{display:inline-block;padding-left:0;animation:marquee 16s linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rail{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:18px;display:grid;gap:16px;justify-items:center;width:60px}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;background:hsl(var(--h) 70% 40%)}
.avatar .plus{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--orange);color:#11100D;font:700 15px/20px var(--body);text-align:center}
.avatar.on .plus{background:#fff}
.act{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.act svg{width:34px;height:34px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.act.on .heart{fill:#FF2D55;stroke:#FF2D55}
.act.on .book{fill:var(--yellow);stroke:var(--yellow)}
.disc{width:40px;height:40px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);display:grid;place-items:center;animation:spin 5s linear infinite}
.disc i{width:16px;height:16px;border-radius:50%;background:hsl(var(--h) 70% 50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:pop .8s ease-out forwards}
.burst svg{width:100%;height:100%;fill:#FF2D55}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}25%{transform:scale(1.15) rotate(-8deg);opacity:1}60%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:scale(1.3) translateY(-60px) rotate(-8deg);opacity:0}}

/* intro slide */
.intro .bgfx{--h:18}
.intro .center{top:auto;bottom:120px;right:16px;gap:12px}
.intro h1{font-family:var(--display);font-size:clamp(40px,11vw,62px);line-height:.92;margin:0;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--orange)}
.howto{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.howto li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px;line-height:1.25}
.howto li b{display:block;font-size:15px}
.howto li small{color:var(--on-feed-dim)}
.howto .ic{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.14);font-size:17px}
.howto .ic svg{width:19px;height:19px}
.intro p{margin:0;color:var(--on-feed-dim);max-width:40ch}
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:grid;justify-items:center;gap:4px;width:64px;font-size:11px;color:var(--on-feed)}
.story .ring{width:58px;height:58px;border-radius:50%;padding:2px;background:conic-gradient(var(--orange),var(--yellow),var(--orange))}
.story .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:2px solid var(--feed-bg);background:hsl(var(--h) 70% 40%);font-family:var(--display);font-size:20px;box-sizing:border-box}
.story em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.swipe{font-family:var(--mono);font-size:12px;color:var(--on-feed-dim);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* top tabs */
.top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:18px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;color:#fff;pointer-events:none}
.top > *{pointer-events:auto}
.top .bug{position:absolute;left:max(14px,env(safe-area-inset-left,0px));font-family:var(--pixel);font-size:15px}
.top .bug b{color:var(--orange);font-weight:400}
.top .t{font-weight:700;font-size:16px;color:rgba(255,255,255,.6);padding-bottom:4px;border-bottom:2px solid transparent}
.top .t[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.top .live{position:absolute;right:max(14px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:var(--orange);color:#11100D;border-radius:3px;padding:2px 5px;font-weight:600}
.app.discover .top{display:none}

/* bottom nav */
nav.bar{position:absolute;left:0;right:0;bottom:0;height:var(--nav-h);z-index:4;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:#000;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app{--nav-h:calc(56px + env(safe-area-inset-bottom,0px))}
nav.bar button{display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;color:rgba(255,255,255,.6)}
nav.bar button[aria-current="page"]{color:#fff}
nav.bar svg{width:24px;height:24px}
nav.bar .post span{display:grid;place-items:center;width:44px;height:28px;border-radius:8px;background:#fff;color:#000;font-size:22px;font-weight:700;
  box-shadow:-3px 0 0 #25F4EE00, 3px 0 0 var(--orange)}

/* bottom sheet (roles) */
.sheet-bg{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:72%;display:flex;flex-direction:column;background:var(--card);color:var(--fg);
  border-radius:16px 16px 0 0;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(100%)}}
.sheet header{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 16px 10px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.sheet header button{position:absolute;right:14px;font-size:20px;line-height:1}
.sheet ul{list-style:none;margin:0;padding:6px 0;overflow-y:auto}
.sheet li{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet li .ic{width:36px;height:36px;border-radius:50%;background:var(--lock);display:grid;place-items:center;font-family:var(--display);font-size:14px}
.sheet li b{display:block;font-size:14px}
.sheet li small{color:var(--muted);font-size:12px}
.sheet li.locked{filter:blur(3px);pointer-events:none;user-select:none}
.sheet .unlock{margin:8px 16px 14px;padding:12px;border-radius:999px;background:var(--orange);color:#11100D;font-weight:700;text-align:center}

/* gate */
.gate{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gate .box{background:var(--card);color:var(--fg);border-radius:16px;padding:22px;max-width:330px;width:100%;display:grid;gap:12px;text-align:center}
.gate h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.05}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate .note{font-family:var(--mono);font-size:11px;color:var(--muted)}
.lockicon{font-family:var(--pixel);font-size:26px;color:var(--orange)}
.btn{font-weight:700;font-size:15px;border-radius:999px;padding:12px 18px;background:var(--orange);color:#11100D}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;pointer-events:none}

/* ---------- DISCOVER (ranking) ---------- */
#rank{position:absolute;inset:0 0 var(--nav-h);overflow-y:auto;background:var(--bg);color:var(--fg)}
.wrap{padding-block:calc(env(safe-area-inset-top,0px) + 18px) 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.wrap .bug{font-family:var(--pixel);font-size:15px}.wrap .bug b{color:var(--orange);font-weight:400}
.wrap h2{font-family:var(--display);font-size:28px;margin:0;line-height:1}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .n{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:14px;background:var(--lock);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--orange)}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wrap h4{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}
.blk{display:grid;gap:10px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg)}
th[aria-sort]{color:var(--fg)}
td.hot{color:var(--orange);font-weight:700}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.coach .hand i,.photo,.frame img,.bgfx,.ticker .run,.disc,.swipe{animation:none}.burst{animation-duration:.01s}}
</style>

<div class="app" id="app">
  <div class="top" role="tablist">
    <span class="bug">DEPLOY<b>.</b></span>
    <button class="t" id="t-follow" role="tab" aria-selected="false">Following</button>
    <button class="t" id="t-fy" role="tab" aria-selected="true">For You</button>
    <span class="live">LIVE</span>
  </div>
  <section id="feed" aria-label="Company feed"></section>
  <section id="rank" hidden aria-label="Discover"></section>
  <nav class="bar" aria-label="Main">
    <button id="n-home" aria-current="page"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
    <button id="n-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Discover</button>
    <button id="n-post" class="post" data-gate="post"><span>+</span></button>
    <button id="n-alerts" data-gate="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>Alerts</button>
    <button id="n-me" data-gate="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
  </nav>
  <div id="layer"></div>
</div>

<script>
const R = __DATA__;
const T = R.totals;
const IMG = __IMAGES__;
const C = R.companies.filter(c => c.israel > 0);
const FREE = 5, HARD = 10;
const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue = s => [...s].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 360, 7);
const handle = s => "@" + s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const ago = d => { const n = Math.round((new Date(T.date) - new Date(d)) / 864e5); return n <= 0 ? "today" : n === 1 ? "1d ago" : n < 30 ? n + "d ago" : Math.round(n/30) + "mo ago"; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let liked = new Set(store.get("hr-liked", [])), saved = new Set(store.get("hr-saved", [])), followed = new Set(store.get("hr-follow", []));
let unlocked = false, gateShown = false;

const ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path class="heart" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  roles: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v4H2V8a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 3h6V5H9zM2 13.5h9V15h2v-1.5h9V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path class="book" d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 4v4C7 9 4 14 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7.5z"/></svg>',
};

function hookOf(c) { return c.hooks.find(h => !h.startsWith("Top US pay") && !h.includes("posted")) || c.hooks[0] || `${c.israel} open roles in Israel`; }
function tagsOf(c) {
  const city = c.cities[0] && !c.cities[0][0].includes("other") ? c.cities[0][0] : "Israel";
  const t = ["#hiring", "#" + city.replace(/[^A-Za-z]/g, "").toLowerCase()];
  if (c.ai_israel >= 3) t.push("#ai");
  const team = c.teams_israel.map(x => x[0].replace(/[^A-Za-z]/g, "").toLowerCase()).find(x => x && x !== "other" && x.length <= 10);
  if (team) t.push("#" + team);
  return t.join(" ");
}

function slide(c, i) {
  const im = IMG[c.name] || {};
  const h = hue(c.name), pay = c.top_paid ? "$" + Math.round(c.top_paid.max / 1000) + "K" : null;
  const roles = c.latest_israel.slice(0, 6).map(j => esc(j.title)).join("  ·  ");
  const bg = im.cover ? `<div class="photo" style="background-image:url(${im.cover})"></div>` : `<div class="bgfx"></div><div class="mono">${esc(c.name[0])}</div>`;
  return `<article class="slide ${im.cover ? "has-img" : ""}" data-i="${i}" data-name="${esc(c.name)}" style="--h:${h};--x1:${20 + h % 40}%;--y1:${25 + h % 30}%">
    ${bg}<div class="shade"></div>
    <div class="center">
      ${im.cover ? `<div class="frame"><img src="${im.cover}" alt="${esc(c.name)}"></div>` : ""}
      <div class="eyebrow">#${i + 1} on the radar · last 30 days</div>
      <div class="bignum" data-count="${c.israel_new30}"><span>+</span>${c.israel_new30}</div>
      <div class="biglabel">new roles in Israel</div>
      <div class="statrow">
        <span class="st"><b>${fmt(c.israel)}</b> open in IL</span>
        <span class="st"><b>${fmt(c.jobs)}</b> worldwide</span>
        ${c.ai_israel ? `<span class="st"><b>${c.ai_israel}</b> AI/ML</span>` : ""}
        ${pay ? `<button class="st lock" data-gate="pay">US pay <b>${pay}</b></button>` : ""}
      </div>
    </div>
    <div class="bottom">
      <div class="handle">${handle(c.name)} <span class="verified" title="Live from their public job board">✓</span></div>
      <div class="caption">${esc(hookOf(c))} <span class="tag">${esc(tagsOf(c))}</span></div>
      <button class="jobs-cta" data-act="roles">View ${fmt(c.israel)} open roles ›</button>
      <div class="ticker"><span class="note">♫</span><span class="track"><span class="run">Now hiring: ${roles}  ·  ${roles}  ·  </span></span></div>
    </div>
    <div class="rail">
      <button class="avatar ${followed.has(c.name) ? "on" : ""}" data-act="follow" aria-label="Follow ${esc(c.name)}">${im.logo ? `<img src="${im.logo}" alt="">` : esc(c.name[0])}<span class="plus">${followed.has(c.name) ? "✓" : "+"}</span></button>
      <button class="act ${liked.has(c.name) ? "on" : ""}" data-act="like" aria-label="Like">${ICON.heart}<span>${fmt(c.israel * 37 + (liked.has(c.name) ? 1 : 0))}</span></button>
      <button class="act" data-act="roles" aria-label="Open roles">${ICON.roles}<span>${fmt(c.israel)} jobs</span></button>
      <button class="act ${saved.has(c.name) ? "on" : ""}" data-act="save" aria-label="Save">${ICON.book}<span>Save</span></button>
      <button class="act" data-act="share" aria-label="Share">${ICON.share}<span>Share</span></button>
      <div class="disc" aria-hidden="true"><i></i></div>
    </div>
  </article>`;
}

const today = C.filter(c => c.latest_israel[0] && (new Date(T.date) - new Date(c.latest_israel[0].published)) / 864e5 <= 3);
const feed = document.getElementById("feed");
feed.innerHTML = `<article class="slide intro" data-i="-1" style="--h:18">
    <div class="bgfx"></div><div class="shade"></div>
    <div class="center">
      <div class="eyebrow">Hiring Radar · ${esc(T.date)}</div>
      <div class="stories">${today.slice(0, 12).map(c => `<button class="story" data-jump="${esc(c.name)}" style="--h:${hue(c.name)}"><span class="ring"><span>${IMG[c.name]?.logo ? `<img src="${IMG[c.name].logo}" alt="">` : esc(c.name[0])}</span></span><em>${esc(c.name)}</em></button>`).join("")}</div>
      <h1><em>${fmt(T.israel_new30)}</em> new tech jobs in Israel this month</h1>
      <p>${fmt(T.israel)} open roles across ${T.companies} companies, live from their job boards. ${fmt(T.ai_israel)} are AI/ML.</p>
      <ol class="howto" aria-label="How it works">
        <li><span class="ic">↑</span><span><b>Swipe up</b><small>One hiring company per screen</small></span></li>
        <li><span class="ic">${ICON.roles}</span><span><b>Tap “jobs” to see every open role</b><small>Apply on the company's own site</small></span></li>
        <li><span class="ic">+</span><span><b>Follow a company</b><small>Get an alert when they post new roles</small></span></li>
      </ol>
      <div class="swipe">↑ Swipe up to start</div>
    </div>
  </article>` + C.map(slide).join("");

const layer = document.getElementById("layer");
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; layer.append(t); setTimeout(() => t.remove(), 1400); }
function gate(reason) {
  const copy = {
    limit: ["Sign up free to keep scrolling", `You've seen ${FREE} companies. Join Deploy for the full feed, US salary ranges and hiring alerts.`],
    hard: ["That's 10 companies", `Sign up free to see all ${C.length}, with every open role, US salary ranges and alerts.`],
    pay: ["Salaries are for members", "See the US pay ranges every company posts. It's free."],
    roles: ["See every open role", "Members see all roles, with links to apply. It's free."],
    post: ["Post your company's roles", "Hiring in Israel? Get your jobs into the Deploy feed."],
    alerts: ["Get hiring alerts", "Know the day a company you follow opens new roles."],
    me: ["Your Deploy profile", "Save companies, follow teams and get alerts."],
    follow: ["Follow companies", "Get alerts when they open new roles. It's free."],
  }[reason] || ["Join Deploy", ""];
  layer.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="g-h"><div class="box">
    <div class="lockicon">[#]</div><h3 id="g-h">${copy[0]}</h3><p id="g-p">${copy[1]}</p>
    <button class="btn" id="g-yes">Sign up free</button>${reason === "hard" ? `<button class="btn ghost" id="g-no">Back to the top</button>` : `<button class="btn ghost" id="g-no">Not now</button>`}
    <div class="note">Prototype: no account is created.</div></div></div>`;
  document.getElementById("g-yes").onclick = () => { document.getElementById("g-p").textContent = "Prototype only: this is where the Deploy signup would open."; };
  document.getElementById("g-no").onclick = () => { layer.innerHTML = ""; if (reason === "limit") unlocked = true; if (reason === "hard") feed.scrollTo({top: 0, behavior: "smooth"}); };
  document.getElementById("g-yes").focus();
}
function sheet(c) {
  const free = 3;
  layer.innerHTML = `<div class="sheet-bg" id="s-bg"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Open roles">
    <header>${fmt(c.israel)} open roles in Israel<button id="s-x" aria-label="Close">×</button></header>
    <ul>${c.latest_israel.map((j, k) => `<li class="${k >= free ? "locked" : ""}"><span class="ic">${esc((j.dept || "R")[0])}</span><span><b>${esc(j.title)}</b><small>${esc(j.dept || "")}${j.dept ? " · " : ""}${esc(j.location)} · ${ago(j.published)}</small></span></li>`).join("")}</ul>
    ${c.israel > free ? `<button class="unlock" id="s-u">Sign up to see all ${fmt(c.israel)} roles</button>` : ""}</div>`;
  const close = () => layer.innerHTML = "";
  document.getElementById("s-bg").onclick = close; document.getElementById("s-x").onclick = close;
  const u = document.getElementById("s-u"); if (u) u.onclick = () => gate("roles");
}
function burst(x, y, el) {
  const b = document.createElement("div"); b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px";
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  el.append(b); setTimeout(() => b.remove(), 900);
}
function setLike(slideEl, on) {
  const name = slideEl.dataset.name, btn = slideEl.querySelector('[data-act="like"]'), c = C.find(x => x.name === name);
  on ? liked.add(name) : liked.delete(name); store.set("hr-liked", [...liked]);
  btn.classList.toggle("on", on); btn.querySelector("span").textContent = fmt(c.israel * 37 + (on ? 1 : 0));
}

feed.addEventListener("click", e => {
  const s = e.target.closest(".slide"); if (!s) return;
  const jump = e.target.closest("[data-jump]");
  if (jump) { const t = feed.querySelector(`.slide[data-name="${CSS.escape(jump.dataset.jump)}"]`); if (t) t.scrollIntoView({behavior: "smooth"}); return; }
  const g = e.target.closest("[data-gate]"); if (g) return gate(g.dataset.gate);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const name = s.dataset.name, c = C.find(x => x.name === name);
  if (a.dataset.act === "like") setLike(s, !liked.has(name));
  if (a.dataset.act === "roles") sheet(c);
  if (a.dataset.act === "save") { saved.has(name) ? saved.delete(name) : saved.add(name); store.set("hr-saved", [...saved]); a.classList.toggle("on"); toast(saved.has(name) ? "Saved" : "Removed from saved"); }
  if (a.dataset.act === "follow") { if (followed.size >= 1 && !followed.has(name)) return gate("follow"); followed.has(name) ? followed.delete(name) : followed.add(name); store.set("hr-follow", [...followed]); a.classList.toggle("on"); a.querySelector(".plus").textContent = followed.has(name) ? "✓" : "+"; toast(followed.has(name) ? "Following " + name : "Unfollowed"); }
  if (a.dataset.act === "share") { const txt = `${name}: +${c.israel_new30} new roles in Israel this month (Deploy Hiring Radar)`; navigator.clipboard?.writeText(txt).then(() => toast("Copied to share"), () => toast(txt)); }
});
let lastTap = 0;
feed.addEventListener("pointerup", e => {
  const s = e.target.closest(".slide[data-name]"); if (!s || e.target.closest("button")) return;
  const now = Date.now();
  if (now - lastTap < 300) { const r = s.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top, s); setLike(s, true); lastTap = 0; }
  else lastTap = now;
});

// first-time walkthrough on the first company
function coach(slideEl) {
  store.set("hr-coach", true);
  const box = document.getElementById("app").getBoundingClientRect();
  const at = sel => { const r = slideEl.querySelector(sel).getBoundingClientRect(); return {x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height}; };
  const cta = at('.jobs-cta'), jobs = at('[data-act="roles"].act'), fol = at('[data-act="follow"]'), like = at('[data-act="like"]');
  const right = box.width - jobs.x + 30, ring = (b, pad = 6) => `<span class="ring" style="left:${b.x - pad}px;top:${b.y - pad}px;width:${b.w + pad * 2}px;height:${b.w + pad * 2}px"></span>`;
  layer.innerHTML = `<div class="coach" role="dialog" aria-label="How it works">
    ${ring(fol)}${ring(like)}${ring(jobs)}
    <div class="tip" style="right:${right}px;top:${fol.y + 4}px">Follow<small>Get an alert when they hire</small></div>
    <div class="tip" style="right:${right}px;top:${like.y + 2}px">Like<small>or double-tap anywhere</small></div>
    <div class="tip" style="right:${right}px;top:${jobs.y + 2}px">See the jobs<small>Every open role in Israel</small></div>
    <span class="pill" style="left:${cta.x - 5}px;top:${cta.y - 5}px;width:${cta.w + 10}px;height:${cta.h + 10}px"></span>
    <div class="cta-tip" style="left:${cta.x}px;top:${cta.y - 34}px">↓ Or tap here to see the jobs</div>
    <div class="hand" style="top:${box.height * .27}px"><i>☝︎</i>Swipe up for the next company</div>
    <button class="ok" id="c-ok" style="top:${jobs.y + jobs.h + 30}px">Got it</button>
  </div>`;
  const close = () => layer.innerHTML = "";
  layer.querySelector(".coach").onclick = close; document.getElementById("c-ok").focus();
}

// count-up + gate after FREE companies
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const i = +e.target.dataset.i;
  if (i >= HARD) { gate("hard"); }
  else if (i >= FREE && !unlocked && !gateShown) { gateShown = true; gate("limit"); }
  if (i === 0 && !store.get("hr-coach", false)) coach(e.target);
  const n = e.target.querySelector("[data-count]");
  if (n && !n.dataset.done && !reduce) {
    n.dataset.done = 1; const end = +n.dataset.count, t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 700); n.innerHTML = "<span>+</span>" + Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}), {root: feed, threshold: .6});
feed.querySelectorAll(".slide").forEach(el => io.observe(el));

// Following tab: only followed companies
document.getElementById("t-follow").onclick = () => {
  if (!followed.size) return toast("Follow a company with + to see it here");
  document.getElementById("t-follow").setAttribute("aria-selected", true); document.getElementById("t-fy").setAttribute("aria-selected", false);
  feed.querySelectorAll(".slide").forEach(s => s.hidden = !(s.dataset.name && followed.has(s.dataset.name)));
  feed.scrollTop = 0;
};
document.getElementById("t-fy").onclick = () => {
  document.getElementById("t-fy").setAttribute("aria-selected", true); document.getElementById("t-follow").setAttribute("aria-selected", false);
  feed.querySelectorAll(".slide").forEach(s => s.hidden = false);
};

// DISCOVER
const app = document.getElementById("app"), rank = document.getElementById("rank");
const cols = [["name","Company"],["ats","Board"],["israel_new30","IL new 30d"],["israel","Open in IL"],["jobs","Worldwide"],["ai_israel","AI/ML in IL"],["us_pay_median_mid","US pay mid"]];
let sortKey = "israel_new30", sortDir = -1;
function renderRank() {
  const rows = [...C].sort((a, b) => { const x = a[sortKey], y = b[sortKey]; return (typeof x === "string" ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * sortDir; });
  const maxCity = Math.max(...T.cities.map(x => x[1])), maxTeam = Math.max(...T.teams.map(x => x[1]));
  rank.innerHTML = `<div class="wrap">
    <span class="bug">DEPLOY<b>.</b></span>
    <h2>Israeli tech hiring, ${esc(T.date)}</h2>
    <div class="sum">
      <div class="kpi"><div class="n">${fmt(T.companies)}</div><div class="l">Companies</div></div>
      <div class="kpi"><div class="n">${fmt(T.israel)}</div><div class="l">Open in Israel</div></div>
      <div class="kpi"><div class="n">${fmt(T.israel_new30)}</div><div class="l">IL, last 30 days</div></div>
      <div class="kpi"><div class="n">${T.israel ? Math.round(T.ai_israel / T.israel * 100) : 0}%</div><div class="l">IL roles AI/ML</div></div>
    </div>
    <div class="blk"><h4>Where the Israel roles are</h4><div class="bars">${T.cities.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${v / maxCity * 100}%"></i></span><span class="v">${v}</span></div>`).join("")}</div></div>
    <div class="blk"><h4>Teams hiring most in Israel</h4><div class="bars">${T.teams.slice(0, 8).map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${v / maxTeam * 100}%"></i></span><span class="v">${v}</span></div>`).join("")}</div></div>
    <div class="blk"><h4>All companies · tap a column to sort</h4>
    <div class="tbl"><table><thead><tr>${cols.map(([k, l]) => `<th tabindex="0" data-k="${k}" ${k === sortKey ? `aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""}>${l}${k === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.ats)}</td><td class="${c.israel_new30 >= 10 ? "hot" : ""}">${c.israel_new30}</td><td>${c.israel}</td><td>${c.jobs}</td><td>${c.ai_israel}</td><td>${c.us_pay_median_mid ? "$" + Math.round(c.us_pay_median_mid / 1000) + "K" : "–"}</td></tr>`).join("")}</tbody></table></div></div>
    <p class="foot">Read directly from each company's public job board (Greenhouse, Lever, Ashby, Workable, SmartRecruiters). "Last 30 days" uses the first-published date, which resets when a role is reposted. US pay is the midpoint of posted US base-salary ranges; Israeli postings don't list pay. Companies on Comeet or Workday aren't included yet. Like counts in the feed are illustrative. Logos and images come from each company's own website. ${T.has_previous ? "Compared with " + esc(T.previous_date) + "." : "First snapshot; daily changes start with the next one."}</p>
  </div>`;
  rank.querySelectorAll("th").forEach(th => { const go = () => { const k = th.dataset.k; sortDir = k === sortKey ? -sortDir : (k === "name" || k === "ats" ? 1 : -1); sortKey = k; renderRank(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }; });
}
renderRank();
function view(v) {
  const d = v === "discover";
  feed.hidden = d; rank.hidden = !d; app.classList.toggle("discover", d); layer.innerHTML = "";
  document.getElementById("n-home").toggleAttribute("aria-current", !d); document.getElementById("n-disc").toggleAttribute("aria-current", d);
  if (d) document.getElementById("n-disc").setAttribute("aria-current", "page"); else document.getElementById("n-home").setAttribute("aria-current", "page");
  history.replaceState(null, "", d ? "#discover" : "#feed");
}
document.getElementById("n-home").onclick = () => view("feed");
document.getElementById("n-disc").onclick = () => view("discover");
document.querySelectorAll("nav.bar [data-gate]").forEach(b => b.onclick = () => gate(b.dataset.gate));
if (location.hash === "#discover") view("discover");
</script>
